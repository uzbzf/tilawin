<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/avatar.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TILAWIN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="ᴛɪʟᴀᴡɪɴ — чтение Корана. Спокойно, чисто, каждый день."
    />
    <title>ᴛɪʟᴀᴡɪɴ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Quran2013 = Madani Uthmanic Hafs from Quran Foundation / quran.com CDN */
      @font-face {
        font-family: 'Quran2013';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/Quran2013.woff2') format('woff2'),
          url('https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2')
            format('woff2');
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tilawin-theme')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (t === 'light') {
            document.documentElement.classList.remove('dark')
            if (meta) meta.setAttribute('content', '#f4efe6')
          } else {
            document.documentElement.classList.add('dark')
            if (meta) meta.setAttribute('content', '#0f172a')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
